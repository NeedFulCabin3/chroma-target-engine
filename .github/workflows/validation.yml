name: Static Code Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate HTML Structure
        run: npx --yes htmlhint index.html

      - name: Validate CSS Syntax
        run: |
          pip install cssutils
          python -c "import cssutils; parser = cssutils.CSSParser(raiseExceptions=True); parser.parseFile('style.css')"
