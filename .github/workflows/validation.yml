name: Markup & Style Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML Structure
        run: npx --yes htmlhint index.html

      - name: Validate CSS Formatting
        run: |
          npx --yes stylelint "style.css" --config '{"rules": {"color-no-invalid-hex": true, "block-no-empty": true}}'
